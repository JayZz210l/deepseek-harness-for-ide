# settings page
dsh.settings.displayName=Deepseek Harness For IDE
dsh.settings.command=dsh command:
dsh.settings.command.tip=Defaults to "dsh". The plugin ships its own bundled DeepSeek Harness runtime, so no global dsh install is needed. Node.js 18+ is still required - when it is missing the plugin prompts you to download it. A dsh found on PATH is preferred over the bundled runtime; a full path or a command with arguments (e.g. node C:\path\to\dsh\lib\bin.js) is also accepted.
dsh.settings.host=Bind address:
dsh.settings.host.tip=Passed to "dsh web --host". Defaults to 127.0.0.1; dsh rejects 0.0.0.0.
dsh.settings.port=Port:
dsh.settings.port.tip=Passed to "dsh web --port". 0 lets the OS pick a free port (recommended, avoids conflicts).
dsh.settings.dshHome=DSH_HOME override:
dsh.settings.dshHome.tip=Where the plugin-managed instance stores its data. Blank = an isolated per-project directory under %LOCALAPPDATA%\deepseek-harness-jetbrains\dsh-home (recommended: your credentials and settings are inherited one-way from ~/.dsh, and an externally running dsh web is never touched). "default" = inherit the IDE environment (shares ~/.dsh with an external dsh web, not multi-instance safe). An absolute path uses that directory.
dsh.settings.autoStart=Start DeepSeek Harness automatically when a project opens
dsh.settings.autoRestart=Restart automatically when the server process exits unexpectedly
dsh.settings.fileJump=File jump (open in IDE):
dsh.settings.fileJump.auto=Auto - DSH composition-native gateway, TCP proxy fallback (recommended)
dsh.settings.fileJump.proxy=TCP proxy only
dsh.settings.fileJump.off=Disabled
dsh.settings.fileJump.tip=How "open file" actions in the DeepSeek Harness UI resolve: natively through a DSH composition patch, through the transport-level TCP proxy, or not at all.
dsh.settings.fileOpen=File open mode:
dsh.settings.fileOpen.auto=Auto - IDE diff when the file is VCS-modified, else open (recommended)
dsh.settings.fileOpen.file=Always open the file
dsh.settings.fileOpen.tip=When a file opened from the DeepSeek Harness UI lands in the IDE editor or in the IDE's native diff viewer (compared against the VCS baseline).
dsh.settings.applyNote=Changes take effect on the next start.
dsh.settings.portError=Port must be an integer between 0 and 65535.
dsh.settings.info=Plugin info
dsh.settings.info.version=Version:
dsh.settings.info.buildDate=Build date:
dsh.settings.info.dshVersion=Bundled DeepSeek Harness:
dsh.settings.info.dataDir=Data directory:
dsh.settings.feedback=Report a problem
dsh.settings.copyDiag=Copy diagnostics

