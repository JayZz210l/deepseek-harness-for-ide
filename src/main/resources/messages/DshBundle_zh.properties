# settings page
dsh.settings.displayName=Deepseek Harness For IDE
dsh.settings.command=dsh 命令：
dsh.settings.command.tip=默认 dsh。插件已内置 DeepSeek Harness 运行时，无需安装 dsh；仍需要 Node.js 18+（缺失时插件会弹窗引导下载）。PATH 中的 dsh 优先于内置运行时；也可以填写完整路径或带参数的命令，如 node C:\path\to\dsh\lib\bin.js
dsh.settings.host=绑定地址：
dsh.settings.host.tip=传给 dsh web --host 的地址，默认 127.0.0.1；dsh 不支持 0.0.0.0
dsh.settings.port=端口：
dsh.settings.port.tip=传给 dsh web --port 的端口；0 表示由系统自动分配空闲端口（推荐，避免冲突）
dsh.settings.dshHome=DSH_HOME 覆盖：
dsh.settings.dshHome.tip=插件实例的数据目录。留空 = 使用 %LOCALAPPDATA%\deepseek-harness-jetbrains\dsh-home 下按项目隔离的独立目录（推荐：插件会单向继承 ~/.dsh 中的凭据与设置，绝不改动外部运行的 dsh web 数据）。填 default = 继承 IDE 环境（与外部 dsh web 共用 ~/.dsh，多实例并发不安全）。填写绝对路径则使用该目录。
dsh.settings.autoStart=打开项目时自动启动 DeepSeek Harness 服务
dsh.settings.autoRestart=服务进程意外退出后自动重启
dsh.settings.fileJump=文件跳转（在 IDE 中打开）：
dsh.settings.fileJump.auto=自动 - DSH 组合层原生网关，TCP 代理回退（推荐）
dsh.settings.fileJump.proxy=仅 TCP 代理
dsh.settings.fileJump.off=关闭
dsh.settings.fileJump.tip=DeepSeek Harness 界面中「打开文件」的解析方式：通过 DSH 组合层补丁原生转发、通过传输层 TCP 代理，或关闭。
dsh.settings.fileOpen=文件打开方式：
dsh.settings.fileOpen.auto=自动 - 文件有 VCS 改动时打开 IDE 原生 Diff，否则直接打开（推荐）
dsh.settings.fileOpen.file=始终直接打开文件
dsh.settings.fileOpen.tip=从 DeepSeek Harness 界面打开文件时，落入 IDE 编辑器还是 IDE 原生 Diff 查看器（对比 VCS 基线）。
dsh.settings.applyNote=修改将在下次启动服务时生效。
dsh.settings.portError=端口必须是 0 到 65535 之间的整数
dsh.settings.info=插件信息
dsh.settings.info.version=插件版本：
dsh.settings.info.buildDate=构建日期：
dsh.settings.info.dshVersion=内置 DeepSeek Harness 版本：
dsh.settings.info.dataDir=数据目录：
dsh.settings.feedback=反馈 BUG / 问题
dsh.settings.copyDiag=复制诊断信息

