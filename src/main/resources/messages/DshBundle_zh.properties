# toolbar actions
dsh.action.start=启动服务
dsh.action.start.desc=启动本地 DeepSeek Harness 服务
dsh.action.stop=停止服务
dsh.action.stop.desc=停止本地 DeepSeek Harness 服务
dsh.action.restart=重启服务
dsh.action.restart.desc=停止并重新启动本地 DeepSeek Harness 服务
dsh.action.openBrowser=在浏览器中打开
dsh.action.openBrowser.desc=使用外部浏览器打开 DeepSeek Harness 页面
dsh.action.copyUrl=复制地址
dsh.action.copyUrl.desc=复制 DeepSeek Harness 页面地址到剪贴板
dsh.action.toggleLog=显示详情
dsh.action.toggleLog.desc=显示或隐藏日志与统计面板
dsh.action.sendSelection=发送选区到 DeepSeek Harness
dsh.action.sendSelection.desc=将选中的文本（或当前行）发送给 DeepSeek Harness
dsh.action.feedback=反馈
dsh.action.feedback.desc=报告问题或提出改进建议

# status card
dsh.status.stopped=DeepSeek Harness 未运行
dsh.status.stopped.detail=点击「启动服务」或下面的「重试」按钮开始。
dsh.status.starting=正在启动 DeepSeek Harness...
dsh.status.starting.detail=正在运行 <code>dsh&nbsp;web</code> 并等待服务就绪，通常需要几秒钟。
dsh.status.stopping=正在停止...
dsh.status.failed=DeepSeek Harness 启动失败
dsh.status.failed.detail=可打开底部日志面板查看详细输出。
dsh.status.retry=重试
dsh.status.syncing=正在从 ~/.dsh 同步插件...
dsh.status.syncing.detail=这是正常现象：DSH 服务已暂时停止，正在用 pnpm 安装同步的插件。视网络情况可能需要一到两分钟，完成后会自动重启，请勿手动重启。
dsh.status.resetting=正在恢复默认插件...
dsh.status.resetting.detail=这是正常现象：DSH 服务已暂时停止，正在清理之前同步的插件配置。通常不到一分钟即可完成并自动重启，请勿手动重启。
dsh.status.initFailed=DeepSeek Harness 界面初始化失败
dsh.status.initFailed.logHint=详情见 Help → Show Log in Explorer（idea.log）。

